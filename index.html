<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Universal File Previewer</title>
<style>
:root{--bg:#f5f6f8;--panel:#fff;--text:#171717;--muted:#6b7280;--line:#e5e7eb;--accent:#111827;--code:#f7f7f8}
*{box-sizing:border-box}html,body{max-width:100%;overflow-x:hidden}button,select{touch-action:manipulation} body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
button{font:inherit}.app{height:100vh;display:grid;grid-template-rows:1fr 42px}
header{display:flex;align-items:center;gap:14px;padding:0 22px;background:var(--panel);border-bottom:1px solid var(--line)}
.brand{font-weight:750;font-size:18px;letter-spacing:-.02em}.spacer{flex:1}
.btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:9px 13px;cursor:pointer}.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
main{min-height:0;display:grid;grid-template-columns:280px 1fr}
aside{background:var(--panel);border-right:1px solid var(--line);padding:16px;overflow:auto;display:flex;flex-direction:column;gap:14px}
.kicker{font-size:11px;font-weight:800;letter-spacing:.12em;color:var(--muted);margin-bottom:4px}
.sidebar-actions{display:flex;gap:7px}.sidebar-actions .btn{flex:1;padding:7px 8px;font-size:12px}
.file-list{display:grid;gap:7px}.file-item{border:1px solid var(--line);background:#fff;border-radius:9px;padding:9px 10px;cursor:pointer;text-align:left;display:grid;grid-template-columns:1fr auto;gap:7px;align-items:center}.file-item:hover{background:#f7f7f8}.file-item.active{border-color:#111827;background:#f3f4f6}.file-item-name{font-size:12px;font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.file-item-meta{font-size:10px;color:var(--muted);margin-top:2px}.file-remove{border:0;background:transparent;color:#888;cursor:pointer;border-radius:5px;padding:2px 5px;font-size:15px}.file-remove:hover{background:#e5e7eb;color:#111}.info-panel{border-top:1px solid var(--line);padding-top:13px}
.file-name{font-weight:700;word-break:break-all;margin-bottom:18px}.meta{display:grid;gap:12px;font-size:13px}
.meta-row{display:grid;grid-template-columns:70px 1fr;gap:8px}.meta-row span:first-child{color:var(--muted)}
.workspace{min-width:0;display:grid;grid-template-rows:52px 1fr;background:#fff}
.toolbar{display:flex;align-items:center;padding:0 16px;border-bottom:1px solid var(--line);gap:8px}
.title{font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.badge{font-size:11px;border:1px solid var(--line);border-radius:999px;padding:4px 8px;color:var(--muted)}
.tabs{margin-left:auto;display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}.tab{border:0;background:#fff;padding:7px 11px;cursor:pointer}.tab.active{background:#f0f1f3;font-weight:650}
.preview{overflow:auto;padding:28px;position:relative}.empty{height:100%;display:grid;place-items:center;text-align:center;color:var(--muted)}
.drop{border:1.5px dashed #c9cdd4;border-radius:16px;padding:42px;max-width:560px;background:#fafafa;cursor:pointer;transition:.18s ease}.drop:hover,.drop:focus{border-color:#111827;background:#f4f5f7;outline:none;transform:translateY(-1px)}.drop strong{display:block;color:var(--text);font-size:20px;margin-bottom:8px}
.preview.dragging:after{content:"Thả file để preview";position:absolute;inset:16px;display:grid;place-items:center;border:2px dashed #111827;border-radius:16px;background:rgba(255,255,255,.92);font-weight:750;font-size:22px}
.markdown{max-width:900px;margin:auto;line-height:1.7}.markdown h1,.markdown h2,.markdown h3{line-height:1.25;margin-top:1.5em}.markdown pre,.source{background:var(--code);border:1px solid var(--line);border-radius:10px;padding:16px;overflow:auto;white-space:pre-wrap;word-break:break-word;font-family:Consolas,monospace;font-size:13px;line-height:1.55}.markdown code{background:#f1f2f4;padding:.15em .35em;border-radius:5px}.markdown pre code{background:none;padding:0}.markdown blockquote{border-left:4px solid #d1d5db;margin-left:0;padding-left:16px;color:#555}.markdown table,.csv-table{border-collapse:collapse;width:100%}.markdown th,.markdown td,.csv-table th,.csv-table td{border:1px solid var(--line);padding:9px 11px;text-align:left}.csv-table th{position:sticky;top:0;background:#f7f7f8}
.media{max-width:100%;max-height:calc(100vh - 190px);display:block;margin:auto}.frame{width:100%;height:100%;border:0}.json-key{font-weight:700}
footer{display:flex;align-items:center;padding:0 18px;padding-left:max(18px,env(safe-area-inset-left));padding-right:max(18px,env(safe-area-inset-right));border-top:1px solid var(--line);background:#fff;color:var(--muted);font-size:12px}
.office-doc{max-width:850px;margin:0 auto;background:#fff;padding:52px 64px;box-shadow:0 2px 18px rgba(0,0,0,.08);min-height:900px;line-height:1.6}
.office-doc img{max-width:100%}.office-doc table{border-collapse:collapse;max-width:100%}.office-doc td,.office-doc th{border:1px solid #bbb;padding:6px 9px}
.sheet-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}.sheet-tab{border:1px solid var(--line);background:#fff;border-radius:7px;padding:6px 10px;cursor:pointer}.sheet-tab.active{background:#111827;color:#fff}
.excel-wrap{overflow:auto}.excel-table{border-collapse:collapse;font-size:13px}.excel-table td,.excel-table th{border:1px solid #d8dadd;padding:6px 9px;min-width:70px;white-space:pre-wrap}.excel-table tr:first-child td{background:#f5f6f8;font-weight:650}
.ppt-wrap{display:grid;grid-template-columns:190px 1fr;gap:18px;height:100%}.ppt-list{overflow:auto;border-right:1px solid var(--line);padding-right:12px}.ppt-thumb{width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:8px;padding:9px;margin-bottom:8px;cursor:pointer}.ppt-thumb.active{border-color:#111827;background:#f5f6f8}.ppt-slide{max-width:960px;aspect-ratio:16/9;margin:auto;border:1px solid var(--line);box-shadow:0 3px 18px rgba(0,0,0,.08);padding:42px;background:white;overflow:auto}.ppt-slide h2{margin-top:0}.ppt-text{margin:8px 0;white-space:pre-wrap}
.view-actions{display:flex;gap:7px;margin-left:8px}.mini-btn{border:1px solid var(--line);background:#fff;border-radius:7px;padding:6px 9px;cursor:pointer;font-size:12px}.mini-btn:hover{background:#f4f4f5}
.multi-grid{height:100%;display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(360px,1fr));align-items:stretch}.preview-pane{min-width:0;min-height:360px;border:1px solid var(--line);border-radius:12px;overflow:hidden;display:grid;grid-template-rows:42px 1fr;background:#fff}.pane-head{display:flex;align-items:center;gap:8px;padding:0 11px;border-bottom:1px solid var(--line);background:#fafafa}.pane-name{font-size:12px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.pane-body{min-height:0;overflow:auto;padding:16px;position:relative}.pane-body .frame{min-height:520px}.pane-body .office-doc{padding:28px;min-height:500px}.pane-close{margin-left:auto;border:0;background:transparent;cursor:pointer;font-size:16px;color:#777}.empty-file-list{font-size:12px;color:var(--muted);padding:8px 2px}
.workspace:fullscreen{width:100vw;height:100vh;background:#fff;grid-template-rows:52px 1fr}.workspace:fullscreen .preview{height:100%;max-height:none}.workspace:fullscreen .frame{height:100%;min-height:calc(100vh - 90px)}.workspace:fullscreen .media{max-height:calc(100vh - 90px)}

/* ===== Responsive optimization ===== */
@media(max-width:1100px){
  main{grid-template-columns:230px minmax(0,1fr)}
  aside{padding:12px}
  .toolbar{padding:0 10px}
  .view-actions{gap:5px}
  .mini-btn{padding:6px 7px}
  .preview{padding:18px}
  .multi-grid{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
  .office-doc{padding:36px 40px}
  .ppt-wrap{grid-template-columns:150px minmax(0,1fr)}
}
@media(max-width:820px){
  .app{height:100dvh;grid-template-rows:1fr auto}
  main{display:block;overflow:auto}
  aside{border-right:0;border-bottom:1px solid var(--line);padding:10px;gap:9px}
  aside .info-panel{display:none}
  aside>div:first-child{position:sticky;top:0;background:var(--panel);z-index:4;padding-bottom:3px}
  .sidebar-actions{display:grid;grid-template-columns:1fr 1fr}
  .file-list{display:flex;overflow-x:auto;gap:7px;padding-bottom:3px;scrollbar-width:thin}
  .file-item{min-width:180px;max-width:230px;flex:0 0 auto}
  .workspace{height:auto;min-height:70dvh;grid-template-rows:auto minmax(0,1fr)}
  .toolbar{min-height:52px;height:auto;padding:8px 10px;flex-wrap:wrap}
  .title{max-width:calc(100% - 90px);order:1}
  .badge{order:2}
  .view-actions{order:3;width:100%;margin-left:0;display:flex;overflow-x:auto;padding-bottom:1px}
  .view-actions .mini-btn{flex:0 0 auto;white-space:nowrap}
  .tabs{order:4;margin-left:0}
  .preview{padding:12px;min-height:55dvh}
  .drop{padding:30px 18px;width:min(100%,560px)}
  .multi-grid{grid-template-columns:1fr}
  .preview-pane{min-height:320px}
  .pane-body{padding:10px}
  .pane-body .frame{min-height:60dvh}
  .office-doc{padding:28px 22px;min-height:0;box-shadow:none}
  .ppt-wrap{grid-template-columns:1fr;height:auto}
  .ppt-list{display:flex;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:0 0 8px}
  .ppt-thumb{min-width:150px;max-width:190px;margin:0 7px 0 0}
  .ppt-slide{padding:24px;min-height:300px}
  .sheet-tabs{overflow-x:auto;flex-wrap:nowrap;padding-bottom:4px}
  .sheet-tab{flex:0 0 auto}
  footer{min-height:36px;height:auto;padding:8px 12px}
}
@media(max-width:520px){
  .app{grid-template-rows:1fr auto}
  aside{padding:8px}
  .sidebar-actions{gap:5px}
  .sidebar-actions .btn{padding:7px 6px;font-size:11px}
  #languageSelect{max-width:118px}
  .file-item{min-width:155px;max-width:185px;padding:7px 8px}
  .toolbar{padding:7px 8px;gap:6px}
  .title{font-size:13px;max-width:calc(100% - 75px)}
  .badge{font-size:10px;padding:3px 6px}
  .mini-btn,.tab{font-size:11px;padding:6px 8px}
  .preview{padding:8px}
  .drop{padding:26px 14px;border-radius:12px}
  .drop strong{font-size:17px}
  .multi-grid{gap:8px}
  .preview-pane{border-radius:9px;min-height:280px}
  .pane-head{padding:0 8px}
  .pane-name{font-size:11px}
  .office-doc{padding:20px 14px;font-size:14px}
  .markdown{font-size:14px;line-height:1.6}
  .markdown table,.csv-table,.excel-table{font-size:12px}
  .markdown th,.markdown td,.csv-table th,.csv-table td,.excel-table td,.excel-table th{padding:6px 7px}
  .source{font-size:12px;padding:10px}
  .ppt-slide{padding:16px;min-height:250px}
  footer{font-size:10px;justify-content:center}
}
/* Fullscreen also adapts on narrow screens */
.workspace:fullscreen{overflow:hidden}
.workspace:fullscreen .preview{min-height:0}
@media(max-width:820px){
  .workspace:fullscreen{height:100dvh;min-height:100dvh;grid-template-rows:auto minmax(0,1fr)}
  .workspace:fullscreen .toolbar{position:relative;z-index:5;background:#fff}
  .workspace:fullscreen .preview{height:auto;overflow:auto}
  .workspace:fullscreen .multi-grid{height:auto}
  .workspace:fullscreen .frame{min-height:calc(100dvh - 115px)}
}

</style>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mammoth@1.8.0/mammoth.browser.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body>
<div class="app">
<input type="file" id="fileInput" multiple hidden>


<main>
<aside>
<div style="display:flex;align-items:center;justify-content:space-between;gap:8px">
      <div class="kicker" data-i18n="files">TỆP</div>
      <select id="languageSelect" class="btn" style="padding:6px 8px;font-size:12px">
        <option value="vi">Tiếng Việt</option>
        <option value="en">English</option>
        <option value="zh">中文</option>
        <option value="ja">日本語</option>
      </select>
    </div>
<div class="sidebar-actions"><button class="btn" id="addFilesBtn" data-i18n="addFiles">+ Thêm tệp</button><button class="btn" id="clearAllBtn" data-i18n="clearAll">Xóa tất cả</button></div>
<div class="file-list" id="fileList"><div class="empty-file-list">Chưa có file.</div></div>
<div class="info-panel"><div class="kicker" data-i18n="selectedFile">TỆP ĐANG CHỌN</div><div class="file-name" id="sideName">Chưa chọn file</div>
<div class="meta"><div class="meta-row"><span data-i18n="type">Loại</span><span id="sideType">—</span></div><div class="meta-row"><span data-i18n="size">Kích thước</span><span id="sideSize">—</span></div><div class="meta-row"><span data-i18n="modified">Chỉnh sửa</span><span id="sideDate">—</span></div></div></div>
</aside>

<section class="workspace">
  <div class="toolbar">
    <div class="title" id="topName">Preview</div>
    <div class="badge" id="badge">No file</div>
    <div class="view-actions" id="viewActions" hidden><button class="mini-btn" id="singleViewBtn" data-i18n="oneFile">1 tệp</button><button class="mini-btn" id="multiViewBtn" data-i18n="allFiles">Tất cả tệp</button><button class="mini-btn" id="clearCurrentBtn" data-i18n="clearCurrent">Xóa tệp hiện tại</button><button class="mini-btn" id="fullscreenBtn" data-i18n="fullscreen">Toàn màn hình</button></div>
    <div class="tabs" id="tabs" hidden>
      <button class="tab active" data-mode="preview" data-i18n="preview">Xem trước</button>
      <button class="tab" data-mode="source" data-i18n="source">Mã nguồn</button>
    </div>
  </div>
  <div class="preview" id="preview">
    <div class="empty"><div class="drop" id="dropZone" role="button" tabindex="0" aria-label="Chọn hoặc kéo thả file">
      <strong>Kéo thả một hoặc nhiều file vào đây</strong>
      hoặc <b>nhấn vào khu vực này để chọn file</b> từ máy tính.<br><br>
      DOCX · XLSX/XLS · PPTX · Markdown · HTML · CSV · JSON · TXT · PDF · Media
    </div></div>
  </div>
</section>
</main>
<footer>Orgin Dev - 2026</footer>
</div>

<script>
const $=s=>document.querySelector(s), preview=$('#preview'), input=$('#fileInput'), tabs=$('#tabs');
let items=[],activeId=null,viewMode='single',mode='preview',seq=0;
let currentLang=localStorage.getItem('ufp_language')||'vi';
if(!['vi','en','zh','ja'].includes(currentLang)) currentLang='vi';
const I18N={
 vi:{files:'TỆP',addFiles:'+ Thêm tệp',clearAll:'Xóa tất cả',selectedFile:'TỆP ĐANG CHỌN',type:'Loại',size:'Kích thước',modified:'Chỉnh sửa',oneFile:'1 tệp',allFiles:'Tất cả tệp',clearCurrent:'Xóa tệp hiện tại',fullscreen:'Toàn màn hình',exitFullscreen:'Thoát toàn màn hình',preview:'Xem trước',source:'Mã nguồn',noFile:'Chưa có tệp.',notSelected:'Chưa chọn tệp',drop:'Kéo thả một hoặc nhiều tệp vào đây',choose:'hoặc nhấn vào khu vực này để chọn tệp từ máy tính.',unknown:'Chưa hỗ trợ xem trước định dạng này.',empty:'Tệp không có dữ liệu.',invalidJson:'JSON không hợp lệ'},
 en:{files:'FILES',addFiles:'+ Add files',clearAll:'Clear all',selectedFile:'SELECTED FILE',type:'Type',size:'Size',modified:'Modified',oneFile:'1 file',allFiles:'All files',clearCurrent:'Clear current',fullscreen:'Fullscreen',exitFullscreen:'Exit fullscreen',preview:'Preview',source:'Source',noFile:'No files.',notSelected:'No file selected',drop:'Drop one or more files here',choose:'or click this area to choose files from your computer.',unknown:'This format is not supported for preview.',empty:'The file has no data.',invalidJson:'Invalid JSON'},
 zh:{files:'文件',addFiles:'+ 添加文件',clearAll:'全部清除',selectedFile:'已选文件',type:'类型',size:'大小',modified:'修改时间',oneFile:'1 个文件',allFiles:'所有文件',clearCurrent:'清除当前文件',fullscreen:'全屏',exitFullscreen:'退出全屏',preview:'预览',source:'源代码',noFile:'暂无文件。',notSelected:'未选择文件',drop:'将一个或多个文件拖放到此处',choose:'或点击此区域从电脑选择文件。',unknown:'暂不支持预览此格式。',empty:'文件没有数据。',invalidJson:'JSON 无效'},
 ja:{files:'ファイル',addFiles:'+ ファイルを追加',clearAll:'すべてクリア',selectedFile:'選択中のファイル',type:'種類',size:'サイズ',modified:'更新日時',oneFile:'1ファイル',allFiles:'すべてのファイル',clearCurrent:'現在のファイルをクリア',fullscreen:'全画面',exitFullscreen:'全画面を終了',preview:'プレビュー',source:'ソース',noFile:'ファイルがありません。',notSelected:'ファイル未選択',drop:'1つ以上のファイルをここにドロップ',choose:'またはこの領域をクリックしてファイルを選択してください。',unknown:'この形式のプレビューには対応していません。',empty:'ファイルにデータがありません。',invalidJson:'JSONが無効です'}
};
const tr=k=>(I18N[currentLang]&&I18N[currentLang][k])||I18N.vi[k]||k;
function applyLanguage(){
 document.documentElement.lang=currentLang;
 document.querySelectorAll('[data-i18n]').forEach(el=>el.textContent=tr(el.dataset.i18n));
 const fb=$('#fullscreenBtn'); if(fb) fb.textContent=document.fullscreenElement?tr('exitFullscreen'):tr('fullscreen');
 updateUI();
 if(!items.length)preview.innerHTML=emptyHTML();
}

const emptyHTML=()=>`<div class="empty"><div class="drop" id="dropZone" role="button" tabindex="0"><strong>${tr('drop')}</strong>${tr('choose')}<br><br>DOCX · XLSX/XLS · PPTX · Markdown · HTML · CSV · JSON · TXT · PDF · Media</div></div>`;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
const ext=n=>(n.split('.').pop()||'').toLowerCase();
const size=n=>n<1024?n+' B':n<1048576?(n/1024).toFixed(1)+' KB':n<1073741824?(n/1048576).toFixed(1)+' MB':(n/1073741824).toFixed(2)+' GB';
function kind(f){const e=ext(f.name),t=f.type;if(e==='docx')return'Word';if(['xlsx','xls'].includes(e))return'Excel';if(e==='pptx')return'PowerPoint';if(['md','markdown'].includes(e))return'Markdown';if(['html','htm'].includes(e))return'HTML';if(['csv','tsv'].includes(e))return e.toUpperCase();if(e==='json')return'JSON';if(t.startsWith('image/'))return'Image';if(t.startsWith('audio/'))return'Audio';if(t.startsWith('video/'))return'Video';if(e==='pdf'||t==='application/pdf')return'PDF';if(['js','mjs','cjs','ts','tsx','jsx','css','scss','java','cs','py','php','rb','go','rs','sql','xml','yml','yaml','sh','bat','ps1','c','cpp','h','hpp','vue','svelte','log','txt'].includes(e))return'Code / Text';return t.startsWith('text/')?'Text':'Unknown'}
const active=()=>items.find(x=>x.id===activeId);
async function addFiles(fs){for(const f of fs){const k=kind(f),x={id:'f'+(++seq),file:f,kind:k,url:URL.createObjectURL(f),text:null};if(['Markdown','HTML','CSV','TSV','JSON','Code / Text','Text'].includes(k))try{x.text=await f.text()}catch{x.text='Không thể đọc file.'}items.push(x);activeId=x.id}updateUI();render()}
function removeFile(id){const i=items.findIndex(x=>x.id===id);if(i<0)return;URL.revokeObjectURL(items[i].url);items.splice(i,1);if(activeId===id)activeId=items[Math.min(i,items.length-1)]?.id||null;updateUI();render()}
function clearAll(){items.forEach(x=>URL.revokeObjectURL(x.url));items=[];activeId=null;viewMode='single';mode='preview';updateUI();render()}
function selectFile(id){activeId=id;viewMode='single';mode='preview';updateUI();render()}
function updateUI(){const a=active();$('#fileList').innerHTML=items.length?items.map(x=>`<button class="file-item ${x.id===activeId?'active':''}" onclick="selectFile('${x.id}')"><span><div class="file-item-name">${esc(x.file.name)}</div><div class="file-item-meta">${esc(x.kind)} · ${size(x.file.size)}</div></span><span class="file-remove" onclick="event.stopPropagation();removeFile('${x.id}')">×</span></button>`).join(''):'<div class="empty-file-list">'+tr('noFile')+'</div>';$('#sideName').textContent=a?a.file.name:tr('notSelected');$('#sideType').textContent=a?a.kind:'—';$('#sideSize').textContent=a?size(a.file.size):'—';$('#sideDate').textContent=a?new Date(a.file.lastModified).toLocaleString(currentLang==='vi'?'vi-VN':currentLang==='zh'?'zh-CN':currentLang==='ja'?'ja-JP':'en-US'):'—';$('#topName').textContent=a?a.file.name:tr('preview');$('#badge').textContent=a?a.kind:tr('notSelected');$('#viewActions').hidden=!items.length;const text=a&&['Markdown','HTML','CSV','TSV','JSON','Code / Text','Text'].includes(a.kind);tabs.hidden=!(text&&viewMode==='single');document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.mode===mode))}
preview.addEventListener('click',e=>{if(e.target.closest('#dropZone'))input.click()});preview.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.closest('#dropZone'))input.click()});$('#addFilesBtn').onclick=()=>input.click();input.onchange=()=>{addFiles([...input.files]);input.value=''};['dragenter','dragover'].forEach(v=>preview.addEventListener(v,e=>{e.preventDefault();preview.classList.add('dragging')}));['dragleave','drop'].forEach(v=>preview.addEventListener(v,e=>{e.preventDefault();preview.classList.remove('dragging')}));preview.addEventListener('drop',e=>addFiles([...e.dataTransfer.files]));$('#clearAllBtn').onclick=clearAll;$('#fullscreenBtn').onclick=async()=>{
 const el=document.querySelector('.workspace');
 try{
  if(!document.fullscreenElement) await el.requestFullscreen();
  else await document.exitFullscreen();
 }catch(e){console.error(e)}
};
document.addEventListener('fullscreenchange',()=>{
 const b=$('#fullscreenBtn');
 if(b) b.textContent=document.fullscreenElement?tr('exitFullscreen'):tr('fullscreen');
});$('#clearCurrentBtn').onclick=()=>activeId&&removeFile(activeId);$('#singleViewBtn').onclick=()=>{viewMode='single';render()};$('#multiViewBtn').onclick=()=>{viewMode='multi';render()};tabs.onclick=e=>{if(e.target.matches('.tab')){mode=e.target.dataset.mode;updateUI();render()}};
async function render(){if(!items.length){preview.innerHTML=emptyHTML();return}updateUI();if(viewMode==='multi'){preview.innerHTML='<div class="multi-grid">'+items.map(x=>`<section class="preview-pane"><div class="pane-head"><span class="pane-name">${esc(x.file.name)}</span><span class="badge">${esc(x.kind)}</span><button class="pane-close" onclick="removeFile('${x.id}')">×</button></div><div class="pane-body" id="p-${x.id}"></div></section>`).join('')+'</div>';for(const x of items)await renderItem(x,$('#p-'+x.id),'preview')}else await renderItem(active(),preview,mode)}
async function renderItem(x,t,m){if(!x)return;if(m==='source'&&x.text!==null){t.innerHTML='<pre class="source">'+esc(x.text)+'</pre>';return}if(x.kind==='Word')return word(x,t);if(x.kind==='Excel')return excel(x,t);if(x.kind==='PowerPoint')return ppt(x,t);if(x.kind==='Markdown'){t.innerHTML='<article class="markdown">'+md(x.text)+'</article>';return}if(x.kind==='HTML'){t.innerHTML='<iframe class="frame" sandbox srcdoc="'+esc(x.text)+'"></iframe>';return}if(['CSV','TSV'].includes(x.kind)){csv(x.text,x.kind==='TSV'?'\t':',',t);return}if(x.kind==='JSON'){try{t.innerHTML='<pre class="source">'+esc(JSON.stringify(JSON.parse(x.text),null,2))+'</pre>'}catch(e){t.innerHTML='<div class="empty">'+tr('invalidJson')+': '+esc(e.message)+'</div>'}return}if(x.kind==='Image'){t.innerHTML='<img class="media" src="'+x.url+'">';return}if(x.kind==='PDF'){t.innerHTML='<iframe class="frame" src="'+x.url+'"></iframe>';return}if(x.kind==='Audio'){t.innerHTML='<div class="empty"><audio controls src="'+x.url+'"></audio></div>';return}if(x.kind==='Video'){t.innerHTML='<video class="media" controls src="'+x.url+'"></video>';return}if(['Code / Text','Text'].includes(x.kind)){t.innerHTML='<pre class="source">'+esc(x.text)+'</pre>';return}t.innerHTML='<div class="empty">'+tr('unknown')+'</div>'}
async function word(x,t){if(!window.mammoth){t.innerHTML=lib('Mammoth.js');return}t.innerHTML='<div class="empty">Đang đọc Word...</div>';try{const r=await mammoth.convertToHtml({arrayBuffer:await x.file.arrayBuffer()});t.innerHTML='<article class="office-doc">'+r.value+'</article>'}catch(e){t.innerHTML=err('Word',e)}}
async function excel(x,t){if(!window.XLSX){t.innerHTML=lib('SheetJS');return}try{const wb=XLSX.read(await x.file.arrayBuffer(),{type:'array',cellDates:true}),key='wb'+x.id;window[key]=wb;t.innerHTML='<div class="sheet-tabs">'+wb.SheetNames.map((n,i)=>`<button class="sheet-tab ${i?'':'active'}" onclick="sheet('${key}',${i},this,'sh${x.id}')">${esc(n)}</button>`).join('')+'</div><div class="excel-wrap" id="sh'+x.id+'"></div>';sheet(key,0,t.querySelector('.sheet-tab'),'sh'+x.id)}catch(e){t.innerHTML=err('Excel',e)}}
function sheet(key,i,b,id){const wb=window[key],root=b.closest('.pane-body')||preview;root.querySelectorAll('.sheet-tab').forEach(z=>z.classList.remove('active'));b.classList.add('active');const h=document.getElementById(id);h.innerHTML=XLSX.utils.sheet_to_html(wb.Sheets[wb.SheetNames[i]]);const tb=h.querySelector('table');if(tb)tb.className='excel-table'}
async function ppt(x,t){if(!window.JSZip){t.innerHTML=lib('JSZip');return}try{const z=await JSZip.loadAsync(await x.file.arrayBuffer()),names=Object.keys(z.files).filter(n=>/^ppt\/slides\/slide\d+\.xml$/.test(n)).sort((a,b)=>+a.match(/slide(\d+)/)[1]-+b.match(/slide(\d+)/)[1]),slides=[];for(const n of names){const d=new DOMParser().parseFromString(await z.file(n).async('text'),'application/xml');slides.push([...d.getElementsByTagNameNS('*','t')].map(q=>q.textContent).filter(Boolean))}const key='pp'+x.id;window[key]=slides;t.innerHTML='<div class="ppt-wrap"><div class="ppt-list">'+slides.map((a,i)=>`<button class="ppt-thumb ${i?'':'active'}" onclick="slide('${key}',${i},this,'st${x.id}')"><b>Slide ${i+1}</b><br>${esc((a.join(' ')||'Không có text').slice(0,80))}</button>`).join('')+'</div><div id="st'+x.id+'"></div></div>';slide(key,0,t.querySelector('.ppt-thumb'),'st'+x.id)}catch(e){t.innerHTML=err('PowerPoint',e)}}
function slide(key,i,b,id){const root=b.closest('.pane-body')||preview;root.querySelectorAll('.ppt-thumb').forEach(z=>z.classList.remove('active'));b.classList.add('active');const a=window[key][i]||[];document.getElementById(id).innerHTML='<div class="ppt-slide">'+(a.length?'<h2>'+esc(a[0])+'</h2>'+a.slice(1).map(q=>'<div class="ppt-text">'+esc(q)+'</div>').join(''):'Không có văn bản')+'</div>'}
function md(v){let z=esc(v);z=z.replace(/^```([\w-]*)\n([\s\S]*?)^```/gm,(m,l,c)=>'<pre><code>'+c+'</code></pre>').replace(/^### (.*)$/gm,'<h3>$1</h3>').replace(/^## (.*)$/gm,'<h2>$1</h2>').replace(/^# (.*)$/gm,'<h1>$1</h1>').replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>').replace(/`([^`\n]+)`/g,'<code>$1</code>').replace(/^(?:-|\*) (.*)$/gm,'<li>$1</li>');z=z.replace(/(?:<li>.*<\/li>\n?)+/g,m=>'<ul>'+m+'</ul>');return z.split(/\n{2,}/).map(a=>/^\s*<(h\d|pre|ul)/.test(a)?a:'<p>'+a.replace(/\n/g,'<br>')+'</p>').join('')}
function rows(text,d){const a=[];let r=[],c='',q=false;for(let i=0;i<text.length;i++){let x=text[i],n=text[i+1];if(x==='"'){if(q&&n==='"'){c+='"';i++}else q=!q}else if(x===d&&!q){r.push(c);c=''}else if((x==='\n'||x==='\r')&&!q){if(x==='\r'&&n==='\n')i++;r.push(c);c='';if(r.some(v=>v!==''))a.push(r);r=[]}else c+=x}r.push(c);if(r.some(v=>v!==''))a.push(r);return a}
function csv(text,d,t){const a=rows(text,d);if(!a.length){t.innerHTML='<div class="empty">'+tr('empty')+'</div>';return}t.innerHTML='<div style="overflow:auto"><table class="csv-table"><thead><tr>'+a[0].map(v=>'<th>'+esc(v)+'</th>').join('')+'</tr></thead><tbody>'+a.slice(1).map(r=>'<tr>'+r.map(v=>'<td>'+esc(v)+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>'}
function lib(n){return'<div class="empty"><div><strong>Không tải được '+n+'.</strong><br><br>Office Preview cần Internet để tải thư viện từ CDN.</div></div>'}function err(n,e){return'<div class="empty">Không thể đọc '+n+': '+esc(e.message||e)+'</div>'}
$('#languageSelect').value=currentLang;
$('#languageSelect').addEventListener('change',e=>{
 currentLang=e.target.value;
 localStorage.setItem('ufp_language',currentLang);
 applyLanguage();
 render();
});
applyLanguage();
</script>
